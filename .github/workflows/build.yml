name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build initramfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cpio zstd xz-utils

      - name: Build all initramfs variants
        run: make -s all initramfs.cpio.zst initramfs.cpio.xz

      - name: Verify output
        run: |
          set -e
          ls -lh initramfs.cpio initramfs.cpio.gz initramfs.cpio.zst initramfs.cpio.xz
          test -x init
          test "$(file -b init | grep -o 'statically linked')" = "statically linked"
          for f in init hello; do
            cpio -it < initramfs.cpio | grep -qx "$f"
          done

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSETS="initramfs.cpio initramfs.cpio.gz initramfs.cpio.zst initramfs.cpio.xz"
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" $ASSETS --title "mininitrd $TAG" --generate-notes \
            || gh release upload "$TAG" $ASSETS --clobber
